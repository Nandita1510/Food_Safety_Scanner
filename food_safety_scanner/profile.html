<!DOCTYPE html>
<html>
<head>
    <title>NutriGuard - Personalized Profile</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f1f8f6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #1e4d6b;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            margin-top: 14px;
            display: block;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #cfd8dc;
            font-size: 14px;
            background-color: #f9fcff;
        }

        .checkbox-group {
            margin-top: 8px;
            padding: 10px;
            background-color: #f4f9ff;
            border-radius: 10px;
            border: 1px solid #d6eaf8;
        }

        .checkbox-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .checkbox-group input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(135deg, #2e86c1, #48c9b0);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div class="container">
    <h2>NutriGuard Personal Health Profile</h2>

    <!-- IMPORTANT: No form submission -->
    
    <label>Full Name</label>
    <input id="name" type="text" placeholder="Enter your name">

    <label>Age</label>
    <input id="age" type="number" placeholder="Enter your age">

    <label>Gender</label>
    <select id="gender">
        <option>Female</option>
        <option>Male</option>
        <option>Other</option>
        <option>Prefer not to say</option>
    </select>

    <label>Height (cm)</label>
    <input id="height" type="number" placeholder="Enter height">

    <label>Weight (kg)</label>
    <input id="weight" type="number" placeholder="Enter weight">

    <label>Medical Conditions</label>
    <div class="checkbox-group">
        <label><input type="checkbox" value="Diabetes"> Diabetes</label>
        <label><input type="checkbox" value="PCOS"> PCOS</label>
        <label><input type="checkbox" value="Thyroid"> Thyroid Disorder</label>
        <label><input type="checkbox" value="Heart"> Heart Condition</label>
        <label><input type="checkbox" value="Hypertension"> High Blood Pressure</label>
        <label><input type="checkbox" value="Cholesterol"> High Cholesterol</label>
    </div>

    <label>Dietary Preference</label>
    <select id="diet">
        <option>Vegetarian</option>
        <option>Vegan</option>
        <option>Gluten-Free</option>
        <option>Low-Fat / Low-Salt</option>
        <option>Ketogenic (Keto)</option>
    </select>

    <label>Primary Health Goal</label>
    <select id="goal">
        <option>Weight Loss</option>
        <option>Weight Gain</option>
        <option>Muscle Building</option>
        <option>Blood Sugar Control</option>
        <option>Heart Health</option>
        <option>General Healthy Eating</option>
    </select>

    <!-- FIXED BUTTON -->
    <button type="button" onclick="saveProfile()">Save & Personalize</button>
</div>

<script>
function saveProfile(){

    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const gender = document.getElementById("gender").value;
    const height = document.getElementById("height").value;
    const weight = document.getElementById("weight").value;
    const diet = document.getElementById("diet").value;
    const goal = document.getElementById("goal").value;

    const checked = document.querySelectorAll("input[type=checkbox]:checked");
    let conditions = [];

    checked.forEach(cb => conditions.push(cb.value));

    const profile = {
        name, age, gender, height, weight, diet, goal, conditions
    };

    localStorage.setItem("nutriProfile", JSON.stringify(profile));

    window.location.href = "scanner.html";
}
</script>

</body>
</html>
